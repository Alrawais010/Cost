<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="تكاليفي">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>تكاليفي</title>
<style>
:root{--bg:#f2f4ef;--card:#fff;--ink:#1b1f1a;--mut:#717a6e;--line:#dde3d8;--acc:#2f6b3a;--onacc:#fff;--side:#1f2b22;--sidei:#e6efe3;
--gold:#c98a12;--red:#b3261e;--up:#b3261e;--down:#2f7d3a;--key:#fff;--bar:#2f6b3a;--bar2:#9fc7a5}
@media (prefers-color-scheme:dark){:root{--bg:#111512;--card:#1b211c;--ink:#eef3ec;--mut:#9aa596;--line:#2f3a31;--acc:#7cc489;--onacc:#0f1a11;--side:#0a0e0b;
--gold:#f0b84a;--red:#f2867e;--up:#f2867e;--down:#8fd69a;--key:#232b24;--bar:#7cc489;--bar2:#3d5a42}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"SF Arabic","Geeza Pro",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,select,textarea{-webkit-user-select:text;user-select:text;font:inherit;font-size:17px}
button{font:inherit;cursor:pointer;touch-action:manipulation}
#app{display:flex;height:100%}
#side{width:80px;flex:none;background:var(--side);color:var(--sidei);display:flex;flex-direction:column;gap:6px;padding:calc(env(safe-area-inset-top) + 10px) 6px calc(env(safe-area-inset-bottom) + 10px);overflow-y:auto}
#side button{background:none;border:0;color:inherit;border-radius:16px;padding:10px 2px;font-size:26px;display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1;flex:none}
#side button span{font-size:14px;font-weight:800;line-height:1.2;text-align:center}
#side button.on{background:var(--acc);color:var(--onacc)}
#side .sp{flex:1;min-height:8px}
#side button.tool{font-size:19px;padding:7px 2px;opacity:.9}
#side button.tool span{font-size:12px;font-weight:600}
#side .ver{text-align:center;font-size:11px;background:rgba(255,255,255,.12);border-radius:12px;padding:6px 2px;line-height:1.3;flex:none}
#side .ver b{display:block;font-size:20px;color:#ffd21f}
#main{flex:1;min-width:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 40px)}
.mh{display:flex;align-items:center;gap:8px}
.mh h1{margin:0;font-size:26px;flex:1}
.mini{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:7px 10px;font-size:14px;font-weight:700}
.mnav{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0;padding:4px}
.mnav button{background:none;border:0;color:var(--acc);font-size:26px;padding:4px 16px;font-weight:700}
.mnav b{font-size:18px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.st span{display:block;font-size:13px;color:var(--mut)}
.st b{font-size:22px;direction:ltr;display:inline-block}
.st small{font-size:13px;color:var(--mut);font-weight:600}
.st.hi{background:var(--acc);color:var(--onacc);border-color:var(--acc)}.st.hi span,.st.hi small{color:inherit;opacity:.85}
.ytd{font-size:13px;color:var(--mut);margin:8px 2px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:12px}
.card h3{margin:0 0 8px;font-size:17px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.fr{display:flex;align-items:stretch;gap:6px}
.fld{flex:1;border:2px solid var(--line);border-radius:12px;padding:6px 10px;min-width:0;background:var(--bg)}
.fld label{display:block;font-size:12px;color:var(--mut)}
.fld .v{font-size:24px;font-weight:800;direction:ltr;text-align:right;min-height:30px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fld.on{border-color:var(--acc);background:var(--card)}
.fld.on .v::after{content:"|";color:var(--acc);font-weight:400;animation:bl 1s steps(1) infinite;margin-left:1px}
@keyframes bl{50%{opacity:0}}
.op{align-self:center;font-size:22px;color:var(--mut)}
.tot{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border-radius:12px;padding:8px 12px;margin:8px 0}
.tot b{font-size:26px;color:var(--acc);direction:ltr}
.or{text-align:center;font-size:12px;color:var(--mut);margin:2px 0 6px}
.wide{display:block;margin-bottom:8px}
.txt{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);min-height:46px;-webkit-appearance:none;appearance:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
.keys button{background:var(--key);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:13px 0;font-size:24px;font-weight:700;box-shadow:0 1px 0 var(--line)}
.keys button:active{background:var(--line)}
.keys .k2{font-size:17px}
.pri{display:block;width:100%;background:var(--acc);color:var(--onacc);border:0;border-radius:14px;padding:15px;font-size:19px;font-weight:800;margin-top:12px}
.sec2{display:block;width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:16px;font-weight:700;margin-top:8px}
.danger{color:var(--red)}
.edit-banner{background:var(--gold);color:#fff;border-radius:10px;padding:6px 10px;font-size:14px;font-weight:700;margin-bottom:8px}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--line);font-size:16px}
.item:first-of-type{border-top:0}
.item .t{flex:1;min-width:0}
.item .t div{font-size:13px;color:var(--mut);margin-top:2px}
.item .amt{font-weight:800;direction:ltr;font-size:17px}
.item.sel{background:var(--bg);border-radius:10px;padding-inline:6px}
.empty{color:var(--mut);font-size:14px;padding:6px 0}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-size:16px}
.kv:first-of-type{border-top:0}
.kv span{color:var(--mut)}.kv b{direction:ltr}
.up{color:var(--up)}.down{color:var(--down)}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-top:10px}
.tabs button{flex:1;background:none;border:0;border-radius:10px;padding:9px 0;font-size:15px;font-weight:800;color:var(--mut)}
.tabs button.on{background:var(--acc);color:var(--onacc)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;color:var(--mut);font-weight:600;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:8px 4px;border-bottom:1px solid var(--line);direction:ltr;text-align:right}
td:first-child{direction:rtl;font-weight:700}
tr.totr td{font-weight:800;border-bottom:0;color:var(--acc)}
.bars{display:flex;align-items:flex-end;gap:4px;height:150px;padding-top:18px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bars .b i{display:block;width:100%;background:var(--bar);border-radius:6px 6px 2px 2px;min-height:2px}
.bars .b.cur i{background:var(--gold)}
.bars .b small{font-size:10px;color:var(--mut);margin-top:4px}
.bars .b em{font-style:normal;font-size:9px;color:var(--mut);margin-bottom:2px;white-space:nowrap}
.share{margin:6px 0}
.share .l{display:flex;justify-content:space-between;font-size:14px}
.share .tr{height:9px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:3px}
.share .tr i{display:block;height:100%;background:var(--bar)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:20px;padding:8px 13px;font-size:14px;font-weight:700}
.chips button.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.big-total{font-size:32px;font-weight:800;direction:ltr;display:inline-block}
.note{font-size:13px;color:var(--mut);line-height:1.6}
#sheet{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;justify-content:flex-end}
#sheet.on{display:flex}
.sh-bg{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.sh-box{position:relative;background:var(--bg);border-radius:20px 20px 0 0;max-height:90%;overflow-y:auto;padding:14px 16px calc(env(safe-area-inset-bottom) + 20px)}
.sh-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.sh-head b{font-size:19px}
.x{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:50%;width:34px;height:34px;font-size:15px}
.f label{display:block;font-size:14px;color:var(--mut);margin:12px 0 5px}
.f input,.f select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);min-height:48px;-webkit-appearance:none;appearance:none}
.f .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sw{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:16px}
.sw input{width:24px;height:24px;min-height:0}
.err{color:var(--red);font-size:14px;margin-top:8px;min-height:1em}
.irow{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.irow:first-child{border-top:0}
.irow .n{flex:1;font-size:17px;font-weight:700}
.irow .n small{display:block;font-size:12px;color:var(--mut);font-weight:400}
#toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 24px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:15px;z-index:30;display:none;max-width:85%;text-align:center}
</style>
</head>
<body>
<div id="app"><nav id="side"></nav><main id="main"></main></div>
<div id="sheet"></div><div id="toast"></div>
<input type="file" id="impIn" accept=".json,application/json" hidden>
<script>
const APP_VER='3';
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const curYMnow=()=>today().slice(0,7);
const ymLabel=ym=>MONTHS[+ym.slice(5)-1]+' '+ym.slice(0,4);
const mShort=ym=>MONTHS[+ym.slice(5)-1];
const addM=(ym,n)=>{let y=+ym.slice(0,4),m=+ym.slice(5)-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+'-'+String(m+1).padStart(2,'0')};
const lastDay=ym=>{const [y,m]=ym.split('-').map(Number);return ym+'-'+String(new Date(y,m,0).getDate()).padStart(2,'0')};
const fmtD=d=>d?d.slice(8)+'/'+d.slice(5,7):'';
const N=v=>{const n=parseFloat(String(v||'').replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/[,٫،]/g,'.'));return isFinite(n)?n:0};
const fmtN=n=>(Math.round((+n||0)*100)/100).toLocaleString('en-US',{maximumFractionDigits:2});
const SAR=' ريال';
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)}
function pct(a,b){if(!b)return '';const p=Math.round((a-b)/b*100);if(!p)return '<span class="muted">= نفس السابق</span>';return `<span class="${p>0?'up':'down'}">${p>0?'▲':'▼'} ${Math.abs(p)}%</span>`}
function diffTxt(d,unit){if(!d)return '<span>بدون تغيير</span>';return `<span class="${d>0?'down':'up'}">${d>0?'▲ زيادة':'▼ نقص'} ${fmtN(Math.abs(d))} ${esc(unit||'')}</span>`}

/* ---------- التخزين ---------- */
let idb;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('takalif',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{idb=r.result;res()};r.onerror=()=>rej(r.error)})}
function tx(mode,fn){return new Promise((res,rej)=>{const t=idb.transaction('kv',mode);const r=fn(t.objectStore('kv'));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})}
const kvGet=k=>tx('readonly',o=>o.get(k)),kvPut=(k,v)=>tx('readwrite',o=>o.put(v,k));
let D={v:1,items:[],ents:[],inv:{}};
function save(){kvPut('db',D).catch(()=>toast('تعذّر الحفظ!'))}
const DEF=[['برسيم','🌿','حزمة',1],['شعير','🌾','كيس',1],['أعلاف','🥣','كيس',1],['علاج','💊','',0],['عمالة','👷','',0],['أخرى','📦','',0]];

/* ---------- الحالة ---------- */
let view='item',cur=null,ym=curYMnow(),F=null,repTab='month',repYM=curYMnow(),repY=curYMnow().slice(0,4),repItem='all';
const item=id=>D.items.find(i=>i.id===id);
const entsOf=(id,m)=>D.ents.filter(e=>(!id||e.item===id)&&(!m||e.date.startsWith(m)));
const sum=(a,f)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const unitOf=it=>it.unit||'وحدة';
function newForm(){F={qty:'',price:'',amt:'',f:'qty',note:'',date:ym===curYMnow()?today():(ym<curYMnow()?lastDay(ym):ym+'-01'),edit:null}}

/* المخزون: لكل شهر أول الشهر + المشترى − الاستهلاك = الباقي */
function stockSeries(it){
  const ms=new Set(entsOf(it.id).map(e=>e.date.slice(0,7)));Object.keys(D.inv[it.id]||{}).forEach(m=>ms.add(m));
  const out={};const now=curYMnow();
  let first=[...ms].sort()[0]||now;if(first>now)first=now;
  let last=[...ms].sort().pop()||now;if(last<now)last=now;
  let open=N(it.start),m=first,g=0;
  while(m<=last&&g++<600){const buy=sum(entsOf(it.id,m),e=>e.qty);const rec=(D.inv[it.id]||{})[m];let used=null,remain;
    if(rec){if(rec.mode==='remain'){remain=N(rec.val);used=open+buy-remain}else{used=N(rec.val);remain=open+buy-used}}else remain=open+buy;
    out[m]={open,buy,used,remain,rec:!!rec};open=remain;m=addM(m,1)}
  return out;
}

/* ---------- الشريط الجانبي ---------- */
function renderSide(){
  $('#side').innerHTML=D.items.map(i=>`<button class="${view==='item'&&cur===i.id?'on':''}" onclick="openItem('${i.id}')">${esc(i.emoji||'•')}<span>${esc(i.name)}</span></button>`).join('')+
  `<div class="sp"></div>
   <button class="tool ${view==='report'?'on':''}" onclick="openReport()">📊<span>التقارير</span></button>
   <button class="tool" onclick="manageItems()">⚙️<span>البنود</span></button>
   <button class="tool" onclick="openBackup()">💾<span>نسخ احتياطي</span></button>
   <div class="ver">الإصدار<b>${APP_VER}</b></div>`;
}
function openItem(id){view='item';cur=id;newForm();try{localStorage.setItem('tk_cur',id)}catch(e){}render();$('#main').scrollTop=0}
function setYM(n){ym=addM(ym,n);newForm();render()}
function render(){renderSide();if(view==='report')return renderReport();if(!item(cur))cur=(D.items[0]||{}).id;if(!cur){$('#main').innerHTML='<div class="empty">أضف بنداً من «البنود»</div>';return}renderItem()}

/* ---------- صفحة البند (الشهر) ---------- */
function renderItem(){
  const it=item(cur),u=unitOf(it),es=entsOf(it.id,ym).sort((a,b)=>b.date.localeCompare(a.date)||b.t-a.t);
  const q=sum(es,e=>e.qty),a=sum(es,e=>e.amount),yq=sum(entsOf(it.id,ym.slice(0,4)),e=>e.qty),ya=sum(entsOf(it.id,ym.slice(0,4)),e=>e.amount);
  const prevA=sum(entsOf(it.id,addM(ym,-1)),e=>e.amount);
  const st=it.track?stockSeries(it)[ym]:null;
  let h=`<div class="mh"><h1>${esc(it.emoji||'')} ${esc(it.name)}</h1><button class="mini" onclick="editItem('${it.id}')">✏️ تعديل</button></div>
  <div class="mnav"><button onclick="setYM(-1)">‹</button><b>${ymLabel(ym)}</b><button onclick="setYM(1)">›</button></div>
  <div class="stats">
    <div class="st"><span>اشتريت هذا الشهر</span><b>${fmtN(q)}</b> <small>${esc(u)}</small></div>
    <div class="st hi"><span>المدفوع هذا الشهر</span><b>${fmtN(a)}</b> <small>ريال</small></div>
    <div class="st"><span>متوسط سعر ${esc(u)}</span><b>${q?fmtN(sum(es.filter(e=>e.qty),e=>e.amount)/q):'—'}</b></div>
    ${st?`<div class="st"><span>المخزون الآن</span><b>${fmtN(st.remain)}</b> <small>${esc(u)}</small></div>`:`<div class="st"><span>مقارنة بالشهر السابق</span><b style="font-size:16px">${prevA?pct(a,prevA):'—'}</b></div>`}
  </div>
  <div class="ytd">منذ بداية ${ym.slice(0,4)}: <b>${fmtN(yq)}</b> ${esc(u)} · <b>${fmtN(ya)}</b> ريال</div>`;
  // نموذج الإدخال
  h+=`<div class="card">${F.edit?'<div class="edit-banner">✏️ تعديل عملية محفوظة</div>':''}
    <div class="fr"><div class="fld" id="f_qty" onclick="setF('qty')"><label>العدد (${esc(u)})</label><div class="v" id="v_qty"></div></div>
    <div class="op">×</div><div class="fld" id="f_price" onclick="setF('price')"><label>سعر ${esc(u)}</label><div class="v" id="v_price"></div></div></div>
    <div class="tot"><span>المجموع</span><b id="v_tot">0</b></div>
    <div class="or">— أو أدخل المبلغ كاملاً بدون سعر —</div>
    <div class="fld wide" id="f_amt" onclick="setF('amt')"><label>المبلغ كاملاً (ريال)</label><div class="v" id="v_amt"></div></div>
    <input class="txt" id="f_note" placeholder="ملاحظات (المورد، النوع…)" value="${esc(F.note)}" oninput="F.note=this.value">
    <div class="row2"><input class="txt" type="date" id="f_date" value="${F.date}" onchange="F.date=this.value"><button class="mini" onclick="clearForm()">مسح الخانات</button></div>
    <div class="keys">${['1','2','3','4','5','6','7','8','9'].map(k=>`<button onclick="key('${k}')">${k}</button>`).join('')}
      <button onclick="key('.')">,</button><button onclick="key('0')">0</button><button class="k2" onclick="key('del')">⌫ تراجع</button></div>
    <button class="pri" id="savebtn" onclick="saveEnt()">حفظ</button>
    ${F.edit?`<button class="sec2" onclick="newForm();render()">إلغاء التعديل</button><button class="sec2 danger" onclick="delEnt()">حذف العملية</button>`:''}
  </div>`;
  // عمليات الشهر
  h+=`<div class="card"><h3>عمليات ${ymLabel(ym)} <span class="note">${es.length} عملية</span></h3>`+(es.length?es.map(e=>`<div class="item ${F.edit===e.id?'sel':''}" onclick="editEnt('${e.id}')"><div class="t"><b>${e.qty?fmtN(e.qty)+' '+esc(u)+(e.price?' × '+fmtN(e.price):''):'مبلغ كامل'}</b><div>${fmtD(e.date)}${e.note?' · '+esc(e.note):''}</div></div><span class="amt">${fmtN(e.amount)}</span></div>`).join(''):'<div class="empty">لا توجد عمليات في هذا الشهر</div>')+`</div>`;
  // المخزون والجرد
  if(st){const prev=stockSeries(it)[addM(ym,-1)];
    h+=`<div class="card"><h3>📦 مخزون ${mShort(ym)}<button class="mini" onclick="invSheet()">${st.rec?'تعديل الجرد':'جرد نهاية الشهر'}</button></h3>
      <div class="kv"><span>أول الشهر</span><b>${fmtN(st.open)}</b></div>
      <div class="kv"><span>اشتريت</span><b>+${fmtN(st.buy)}</b></div>

function itemRows(es){return D.items.map(it=>{const x=es.filter(e=>e.item===it.id);const q=sum(x,e=>e.qty),a=sum(x,e=>e.amount),qa=sum(x.filter(e=>e.qty),e=>e.amount);return {it,q,a,avg:q?qa/q:0,n:x.length}}).filter(r=>r.n)}

function repMonth(){
  const es=entsOf(null,repYM),tot=sum(es,e=>e.amount),prev=sum(entsOf(null,addM(repYM,-1)),e=>e.amount),ly=sum(entsOf(null,addM(repYM,-12)),e=>e.amount);

    <div class="kv" style="margin-top:8px"><span>مقارنة بـ${mShort(addM(repYM,-1))}</span>${prev?pct(tot,prev)+' <b>('+fmtN(prev)+')</b>':'<span class="note">لا بيانات</span>'}</div>
    ${ly?`<div class="kv"><span>مقارنة بنفس الشهر العام الماضي</span>${pct(tot,ly)}</div>`:''}

  h+=`<div class="card"><span class="note">${sel?'مصروف '+esc(sel.name):'مجموع مصروف السنة'}</span><br><span class="big-total">${fmtN(ytot)}</span> ريال
    ${!sel&&prevY?`<div class="kv" style="margin-top:8px"><span>مقارنة بسنة ${+y-1}</span>${pct(tot,prevY)}</div>`:''}
    <div class="kv"><span>المتوسط الشهري</span><b>${fmtN(activeM?ytot/activeM:0)}</b></div>
    ${ytot?`<div class="kv"><span>أعلى شهر</span><b>${MONTHS[best]} · ${fmtN(mv[best])}</b></div>`:''}
    <div class="bars">${mv.map((v,i)=>`<div class="b ${ms[i]===curYMnow()?'cur':''}" onclick="repTab='month';repYM='${ms[i]}';render()"><em>${v?(v>=1000?fmtN(Math.round(v/100)/10)+'k':fmtN(v)):''}</em><i style="height:${v/mx*100}%"></i><small>${i+1}</small></div>`).join('')}</div>
    <div class="note" style="text-align:center">اضغط على أي شهر لفتح تقريره</div></div>`;

     ms.map(m=>{const x=entsOf(sel.id,m),q=sum(x,e=>e.qty),a=sum(x,e=>e.amount),st=ss[m];if(!x.length&&!(st&&st.rec))return '';
       return `<tr><td>${mShort(m)}</td><td>${q?fmtN(q):'—'}</td><td>${fmtN(a)}</td><td>${q?fmtN(sum(x.filter(e=>e.qty),e=>e.amount)/q):'—'}</td>${sel.track?`<td>${st&&st.used!=null?fmtN(st.used):'—'}</td><td>${st?fmtN(st.remain):'—'}</td>`:''}</tr>`}).join('')+
     `<tr class="totr"><td>المجموع</td><td>${fmtN(sum(entsOf(sel.id,y),e=>e.qty))}</td><td>${fmtN(ytot)}</td><td></td>${sel.track?'<td></td><td></td>':''}</tr></table>
     <div class="note" style="margin-top:6px">الكمية بالـ${esc(u)}</div></div>`;
  }else{const rows=itemRows(es);
    if(rows.length)h+=`<div class="card"><h3>البنود خلال السنة</h3><table><tr><th>البند</th><th>الكمية</th><th>المبلغ</th><th>متوسط السعر</th></tr>`+rows.map(r=>`<tr onclick="repItem='${r.it.id}';render()"><td>${esc(r.it.name)}</td><td>${r.q?fmtN(r.q):'—'}</td><td>${fmtN(r.a)}</td><td>${r.avg?fmtN(r.avg):'—'}</td></tr>`).join('')+`<tr class="totr"><td>المجموع</td><td></td><td>${fmtN(tot)}</td><td></td></tr></table></div>
      <div class="card"><h3>نسبة كل بند من مصروف السنة</h3>${shareBars(rows,tot)}</div>`}
  return h;
}
function repStock(){
  const tr=D.items.filter(i=>i.track);if(!tr.length)return '<div class="card empty">لا توجد بنود مفعّل لها المخزون. فعّله من «البنود».</div>';

  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  if('serviceWorker' in navigator){const had=!!navigator.serviceWorker.controller;let rl=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!rl){rl=true;location.reload()}});
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{r.update();document.addEventListener('visibilitychange',()=>{if(!document.hidden)r.update()})}).catch(()=>{})}
})();
</script>
